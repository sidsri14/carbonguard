<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarbonGuard Demo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      --bg: #071311;
      --panel: #0c211d;
      --panel-2: #102b25;
      --ink: #f2fbf7;
      --muted: #a9c7bb;
      --green: #51e39b;
      --amber: #ffca72;
      --red: #ff7d7d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); }
    .slide { width: 1280px; height: 720px; padding: 46px 58px 38px; position: relative; background:
      radial-gradient(circle at 92% 8%, rgba(81, 227, 155, .15), transparent 30%),
      radial-gradient(circle at 6% 94%, rgba(38, 124, 96, .18), transparent 30%), var(--bg); }
    .eyebrow { color: var(--green); font-size: 18px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { font-size: 54px; line-height: 1.02; max-width: 1050px; margin: 16px 0 18px; letter-spacing: -.035em; }
    h2 { font-size: 38px; margin: 12px 0 24px; letter-spacing: -.025em; }
    .lead { color: var(--muted); font-size: 25px; line-height: 1.45; max-width: 1060px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 28px; }
    .grid.two { grid-template-columns: repeat(2, 1fr); }
    .card { background: linear-gradient(145deg, var(--panel), var(--panel-2)); border: 1px solid #1d493d; border-radius: 18px; padding: 22px; min-height: 150px; }
    .card strong { color: var(--green); display: block; font-size: 20px; margin-bottom: 9px; }
    .card p, li { color: var(--muted); font-size: 20px; line-height: 1.38; }
    ul { padding-left: 26px; margin: 12px 0 0; }
    li { margin: 9px 0; }
    .terminal { background: #030a08; border: 1px solid #245445; border-radius: 16px; padding: 22px 24px; margin-top: 22px; font: 18px/1.45 Consolas, monospace; color: #d7f7e8; white-space: pre-wrap; }
    .ok { color: var(--green); }
    .warn { color: var(--amber); }
    .bad { color: var(--red); }
    .flow { display: flex; align-items: center; gap: 12px; margin-top: 42px; }
    .node { flex: 1; min-height: 118px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid #27614e; font-size: 20px; font-weight: 750; }
    .arrow { color: var(--green); font-size: 30px; }
    .metric { font-size: 46px; font-weight: 850; color: var(--green); }
    .metric-label { color: var(--muted); font-size: 17px; margin-top: 6px; }
    .footer { position: absolute; left: 58px; right: 58px; bottom: 24px; display: flex; justify-content: space-between; color: #6f9b8b; font-size: 16px; }
    .accent { color: var(--green); }
  </style>
</head>
<body>
  <main class="slide" id="slide"></main>
  <script>
    const slides = [
      `<div class="eyebrow">IEEE ClimateChain Global Hackathon 2026</div>
       <h1>CarbonGuard</h1>
       <p class="lead">An MRV audit gateway and Solidity registry that makes carbon-credit evidence inspectable, single-use, and permanently retireable.</p>
       <div class="grid">
         <div class="card"><strong>Bounded telemetry</strong><p>Reject unregistered, replayed, or physically impossible sensor readings.</p></div>
         <div class="card"><strong>Attestation integrity</strong><p>Hash accepted evidence into an append-only audit chain.</p></div>
         <div class="card"><strong>On-chain lifecycle</strong><p>Enforce oracle-only minting and irreversible owner retirement.</p></div>
       </div>`,
      `<div class="eyebrow">Problem</div><h2>Tokenization is easy. Trustworthy evidence is not.</h2>
       <div class="grid">
         <div class="card"><strong>Sensor spoofing</strong><p>A reported energy value can exceed the facility's physical output.</p></div>
         <div class="card"><strong>Attestation replay</strong><p>The same evidence can be presented twice to mint duplicate claims.</p></div>
         <div class="card"><strong>Double retirement</strong><p>Fragmented records allow one credit to be claimed by multiple beneficiaries.</p></div>
       </div>
       <p class="lead" style="margin-top:26px">CarbonGuard separates off-chain measurement checks from on-chain lifecycle enforcement, then tests both boundaries.</p>`,
      `<div class="eyebrow">Architecture</div><h2>Evidence moves through explicit trust boundaries</h2>
       <div class="flow"><div class="node">IoT<br>telemetry</div><div class="arrow">&rarr;</div><div class="node">Capacity +<br>replay checks</div><div class="arrow">&rarr;</div><div class="node">SHA-256<br>attestation</div><div class="arrow">&rarr;</div><div class="node">Solidity<br>registry</div><div class="arrow">&rarr;</div><div class="node">Irreversible<br>retirement</div></div>
       <div class="grid two"><div class="card"><strong>Off-chain</strong><p>Calculations, device bounds, timestamps, attestations, and a tamper-evident audit log.</p></div><div class="card"><strong>On-chain</strong><p>Oracle authorization, attestation uniqueness, ownership, status, and retirement timestamp.</p></div></div>`,
      `<div class="eyebrow">MRV Demo</div><h2>Invalid physical evidence fails closed</h2>
       <div class="terminal"><span class="ok">VERIFIED</span>  820 kWh from registered 1 MW solar array
SHA-256   648f5c19180419c2...e97d7

<span class="bad">BLOCKED</span>   3,000 kWh from the same array in one hour
Reason    ANOMALY_CAPACITY_EXCEEDED
Ceiling   1,050 kWh including 5% tolerance

<span class="bad">BLOCKED</span>   repeated timestamp
Reason    REPLAY_ATTACK_DETECTED</div>
       <p class="lead">The prototype records why a reading was rejected instead of silently dropping it or asking an LLM to decide.</p>`,
      `<div class="eyebrow">Solidity Enforcement</div><h2>The registry owns the non-negotiable invariants</h2>
       <div class="grid two">
         <div class="card"><strong>Mint</strong><ul><li>Configured oracle only</li><li>Non-zero credit and attestation hashes</li><li>One credit per attestation</li></ul></div>
         <div class="card"><strong>Retire</strong><ul><li>Active credit only</li><li>Current owner only</li><li>Permanent status transition</li></ul></div>
       </div>
       <div class="terminal">CarbonCreditRegistry runtime: <span class="ok">1,796 bytes</span>
Solidity optimizer: 200 runs
Execution target: real local EVM</div>`,
      `<div class="eyebrow">Local EVM Demo</div><h2>Attack paths revert with named errors</h2>
       <div class="terminal">Contract: 0x5dddfce53ee040d9eb21afbc0ae1bb4dbb0ba643
<span class="ok">Mint: accepted</span> (247,800 grams CO2e)
<span class="bad">Duplicate attestation: blocked</span> (AttestationAlreadyUsed)
<span class="ok">Retirement: recorded</span> status=2 (Retired)
<span class="bad">Second retirement: blocked</span> (CreditNotActive)</div>
       <p class="lead">The test suite also proves that a non-oracle cannot mint and a non-owner cannot retire.</p>`,
      `<div class="eyebrow">Verification and Scope</div><h2>Reproducible proof, with honest limits</h2>
       <div class="grid">
         <div class="card"><div class="metric">18/18</div><div class="metric-label">MRV + local-EVM tests</div></div>
         <div class="card"><div class="metric">0</div><div class="metric-label">npm audit findings</div></div>
         <div class="card"><div class="metric">3</div><div class="metric-label">Node versions in CI</div></div>
       </div>
       <div class="card" style="margin-top:20px;min-height:120px"><strong>Deliberate limits</strong><p>No public-chain deployment, live sensor fleet, certified factor governance, or production offset claim. CarbonGuard is an inspectable prototype for the integrity boundary.</p></div>`,
    ];
    const index = Math.max(0, Math.min(slides.length - 1, Number(new URLSearchParams(location.search).get('slide') || 1) - 1));
    document.getElementById('slide').innerHTML = slides[index] + `<div class="footer"><span>github.com/sidsri14/carbonguard</span><span>${index + 1} / ${slides.length}</span></div>`;
  </script>
</body>
</html>
